<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Downloader</title>
  <meta name="description" content="YouTube Downloader">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">YouTube Downloader</div>
    </div>
  </header>

  <main class="page">
    <section class="downloader" aria-label="YouTube Downloader">
      <form id="download-form" novalidate>
        <div class="url-wrap">
          <input id="url" class="url-input" name="url" type="url" inputmode="url" autocomplete="off" placeholder="YouTube URL" aria-label="YouTube URL" required>
        </div>

        <div class="selector-block">
          <div class="formats" aria-label="Формат">
            <input class="choice-radio" id="format-mp3" name="format" type="radio" value="mp3" checked>
            <label class="choice" for="format-mp3">MP3</label>
            <input class="choice-radio" id="format-wav" name="format" type="radio" value="wav">
            <label class="choice" for="format-wav">WAV</label>
            <input class="choice-radio" id="format-video" name="format" type="radio" value="video">
            <label class="choice" for="format-video">VIDEO</label>
          </div>

          <div id="qualities" class="qualities" aria-label="Разрешение видео" hidden>
            <input class="choice-radio" id="quality-low" name="quality" type="radio" value="low">
            <label class="choice quality-choice" for="quality-low">480p</label>
            <input class="choice-radio" id="quality-medium" name="quality" type="radio" value="medium">
            <label class="choice quality-choice" for="quality-medium">720p</label>
            <input class="choice-radio" id="quality-maximum" name="quality" type="radio" value="maximum" checked>
            <label class="choice quality-choice" for="quality-maximum">MAX</label>
          </div>
        </div>

        <button id="download" class="download" type="submit">Скачать</button>
      </form>

      <div class="message-area">
        <p id="status" class="status" aria-live="polite" hidden></p>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
    </section>
  </main>

  <footer>Скачивайте только то, что можно. Этот софт ничего не гарантирует.</footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
