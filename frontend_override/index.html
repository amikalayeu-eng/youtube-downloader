<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Downloader</title>
  <meta name="description" content="YouTube Downloader">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="page">
    <section class="downloader" aria-labelledby="page-title">
      <h1 id="page-title">YouTube Downloader</h1>

      <form id="download-form" novalidate>
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off" placeholder="YouTube URL" aria-label="YouTube URL" required>

        <div class="formats" role="radiogroup" aria-label="Формат">
          <button class="choice selected" data-format="mp3" type="button" role="radio" aria-checked="true">MP3</button>
          <button class="choice" data-format="wav" type="button" role="radio" aria-checked="false">WAV</button>
          <button class="choice" data-format="video" type="button" role="radio" aria-checked="false">VIDEO</button>
        </div>

        <div id="qualities" class="qualities" role="radiogroup" aria-label="Разрешение видео" hidden>
          <button class="choice" data-quality="low" type="button" role="radio" aria-checked="false">480p</button>
          <button class="choice" data-quality="medium" type="button" role="radio" aria-checked="false">720p</button>
          <button class="choice selected" data-quality="maximum" type="button" role="radio" aria-checked="true">MAX</button>
        </div>

        <button id="download" class="download" type="submit">Скачать</button>
      </form>

      <p id="status" class="status" aria-live="polite" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <footer>Скачивайте только то, что можно. Этот софт ничего не гарантирует.</footer>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
