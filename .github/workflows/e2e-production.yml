name: Production MP3 E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-production.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test production download
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-da4c9.up.railway.app'
          URL='https://www.youtube.com/watch?v=f0Gi8AjGpt8'
          COOKIE="$(mktemp)"
          START="$(date +%s)"

          HTTP="$(curl -sS -o /tmp/submit.json -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
            -H 'content-type: application/json' \
            -X POST "$BASE/api/fast-download" \
            --data "{\"url\":\"$URL\",\"format\":\"mp3\",\"quality\":\"maximum\"}")"
          echo "SUBMIT_HTTP=$HTTP"
          cat /tmp/submit.json
          test "$HTTP" = '202'

          JOB_ID="$(python3 -c 'import json; print(json.load(open("/tmp/submit.json"))["id"])')"
          echo "JOB_ID=$JOB_ID"

          STATUS=''
          for i in $(seq 1 180); do
            sleep 1
            curl -sS -o /tmp/status.json -c "$COOKIE" -b "$COOKIE" "$BASE/api/jobs/$JOB_ID"
            STATUS="$(python3 -c 'import json; print(json.load(open("/tmp/status.json")).get("status", ""))')"
            STAGE="$(python3 -c 'import json; print(json.load(open("/tmp/status.json")).get("stage", ""))')"
            if (( i % 5 == 0 )) || [[ "$STATUS" == 'ready' || "$STATUS" == 'failed' || "$STATUS" == 'cancelled' ]]; then
              echo "STATE=$STATUS STAGE=$STAGE ELAPSED=$(( $(date +%s) - START ))s"
            fi
            if [[ "$STATUS" == 'ready' ]]; then break; fi
            if [[ "$STATUS" == 'failed' || "$STATUS" == 'cancelled' ]]; then cat /tmp/status.json; exit 1; fi
          done
          test "$STATUS" = 'ready'

          FILE_HTTP="$(curl -sS -o /tmp/result.mp3 -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "$BASE/api/jobs/$JOB_ID/stream")"
          SIZE="$(stat -c%s /tmp/result.mp3)"
          echo "FILE_HTTP=$FILE_HTTP SIZE=$SIZE TOTAL=$(( $(date +%s) - START ))s"
          test "$FILE_HTTP" = '200'
          test "$SIZE" -gt 10000
